[workspace]
resolver = "3"
members = ["bin/app-server", "bin/manage-tool", "lib/app_protobuf", "modules/base"]

[workspace.package]
version = "0.1.0-alpha"
authors = []
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Runtime
tokio = { version = "1.49", features = ["full"] }

# Framework
wakuwaku = { version = "0.3", features = ["tracing-otel", "tonic", "sqlx", "amqprs"] }
kanau = { version = "0.6", features = [
    "message",
    "rkyv",
    "bincode",
    "serde_json",
] }
amqprs = { version = "2.1", features = ["uriparse", "urispec"] }
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "time",
    "derive",
    "macros",
    "uuid",
    "rust_decimal",
    "json",
    "ipnetwork",
] }
redis = { version = "1.0", features = ["tokio-comp", "uuid", "json"] }
axum = { version = "0.8", features = ["macros", "form"] }
tower = "0.5"

# gRPC
tonic-prost-build = "0.14"
tonic = { version = "0.14", features = ["router", "server"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"

# Serialization & Deserialization
rkyv = { version = "0.8", features = ["uuid-1", "bytecheck"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1.19"
bytes = "1.10"
fast32 = "1.0.3"
bincode = { version = "2", features = ["serde"] }
urlencoding = "2.1"

# Data types
uuid = { version = "1.10", features = ["serde", "v4", "v7"] }
rust_decimal = { version = "1.37", features = ["rkyv"] }
compact_str = { version = "0.10.0", features = [
    "serde",
    "sqlx-postgres",
    "bytes",
    "smallvec",
] }
time = { version = "0.3", features = ["serde", "serde-human-readable"] }
url = { version = "2.5", features = ["serde"] }
smallvec = { version = "1.14.0", features = [
    "serde",
    "union",
    "const_generics",
    "const_new",
] }

# External tools
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "zstd", "deflate"] }
clap = { version = "4.5", features = ["derive", "env"] }

# Auth & Security
rand = "0.10"
validator = "0.21"
jsonwebtoken = "11"
sha2 = "0.11"
zeroize = { version = "1.8", features = ["derive"] }

# OpenTelemetry
opentelemetry = { version = "0.33", features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.33", features = ["metrics"] }
opentelemetry-otlp = { version = "0.33", features = ["trace", "metrics", "logs", "grpc-tonic"] }
tracing-opentelemetry = { version = "0.33", features = ["metrics"] }
opentelemetry-appender-tracing = "0.33"

# Tracing
tracing = "0.1"

# Algorithm
itertools = "0.15"

[profile.dev.package.sqlx-macros]
opt-level = 3
